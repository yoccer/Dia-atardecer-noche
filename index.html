<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El interruptor de la noche y el día</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="escena" id="escena">
    <!-- Estrellas -->
    <div class="estrellas" id="estrellas"></div>

    <!-- Luna -->
    <div class="luna" id="luna">
      <span class="crater c1"></span>
      <span class="crater c2"></span>
      <span class="crater c3"></span>
    </div>

    <!-- Sol -->
    <div class="sol" id="sol"></div>

    <!-- Nubes -->
    <div class="nube nube1"></div>
    <div class="nube nube2"></div>
    <div class="nube nube3"></div>

    <!-- Colinas -->
    <div class="colina colina-atras"></div>
    <div class="colina colina-frente"></div>

    <!-- Lámpara con cuerda -->
    <div class="lampara" id="lampara">
      <div class="cable"></div>
      <div class="pantalla">
        <div class="bombilla" id="bombilla"></div>
      </div>
      <div class="cuerda-contenedor" id="cuerdaContenedor">
        <div class="cuerda" id="cuerda"></div>
        <div class="bolita" id="bolita"></div>
      </div>
    </div>

    <!-- Texto de ayuda -->
    <p class="ayuda" id="ayuda">Arrastra la cuerda hacia abajo 👇</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
